# Portal-22 machine definitions
# Usage: ./portal_22.py -f data.yml [--dry-run]
#
# Fields:
#   host:        SSH Host alias (required unless global: true)
#   hostname:    HostName override (optional — defaults to host value or platform map)
#   user:        SSH user for config entry (required unless global: true)
#   type:        key type — git, admin, deploy, ci, tunnel (optional)
#   platform:    codeberg, github, gitlab, gitea (optional — requires type, exclusive with host)
#   encryption:  ed25519, rsa, ecdsa (optional — default: ed25519)
#   passphrase:  true/false (optional — default: false)
#   global:      true/false — use local hostname, writes IdentityFile to Host * (optional)

machines:
  # Global key — uses local machine hostname, added to Host * in ~/.ssh/config
  - global: true
    encryption: ed25519

  # Git platform keys — alias and hostname resolved from built-in platform map
  - type: git
    platform: codeberg
    user: git

  - type: git
    platform: github
    user: git

  # Admin key to a homelab host
  - host: mikoshi
    hostname: mikoshi.home.arpa
    user: arpatek
    type: admin
    encryption: ed25519

  # Basic host key — no type prefix
  - host: gonk-1
    hostname: gonk-1.home.arpa
    user: sysadmin
