  # ── Practice VMs — UTM on darwin, shared net ────────────────────────────────

  - host: glados
    hostname: 192.168.64.210
    user: sysadmin

  - host: tars
    hostname: 192.168.64.211
    user: sysadmin

  # ── Practice VMs — UTM on mizutani, bridged ─────────────────────────────────

  - host: gort
